apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "retention": {
          "dryRun": false,
          "delay": "24h",
          "policies": [
            {
              "repositories": ["**"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [
                {
                  "patterns": ["^ih-[0-9a-f]+$"],
                  "mostRecentlyPushedCount": 20,
                  "pushedWithin": "2160h"
                }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "tls": {
          "cert": "/certs/tls.crt",
          "key": "/certs/tls.key"
        },
        "auth": {
          "htpasswd": {
            "path": "/auth/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["puller"],
                  "actions": ["read"]
                }
              ],
              "defaultPolicy": []
            }
          },
          "adminPolicy": {
            "users": ["ci"],
            "actions": ["read", "create", "update", "delete", "detectManifestCollision"]
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "scrub": {
          "enable": true,
          "interval": "24h"
        },
        "search": {
          "enable": true
        },
        "ui": {
          "enable": true
        },
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      }
    }
