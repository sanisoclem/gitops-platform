apiVersion: batch/v1
kind: CronJob
metadata:
  name: nas-config-backup
  namespace: nas-config-backup
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: save
              image: curlimages/curl:8.22.0
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  file="/backup/truenas-config-$(date +%Y%m%d).tar"
                  curl -sSk --fail --max-time 300 -X POST \
                    -H "Authorization: Bearer $API_KEY" \
                    -H 'Content-Type: application/json' \
                    -d '{"secretseed": true, "root_authorized_keys": true}' \
                    "https://$NAS_HOST/api/v2.0/config/save" -o "$file.part"
                  tar -tf "$file.part" >/dev/null
                  mv "$file.part" "$file"
                  ls -1t /backup/truenas-config-*.tar | tail -n +31 | xargs -r rm -f
              env:
                - name: NAS_HOST
                  valueFrom:
                    secretKeyRef:
                      name: truenas
                      key: host
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: truenas
                      key: api-key
              volumeMounts:
                - name: apps
                  mountPath: /backup
                  subPath: platform/nas-config
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: apps
              nfs:
                server: placeholder
                path: placeholder
