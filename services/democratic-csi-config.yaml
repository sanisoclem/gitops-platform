apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-block-backed
  namespace: democratic-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: democratic-csi-block-backed
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: democratic-csi-block-backed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-block-transient
  namespace: democratic-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: democratic-csi-block-transient
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: democratic-csi-block-transient
