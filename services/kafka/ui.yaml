apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-nginx-conf
  namespace: kafka
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 8443 ssl;
        ssl_certificate /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        location / {
          proxy_pass http://localhost:8080;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: kafka
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: KAFKA_CLUSTERS_0_READONLY
              value: "true"
            - name: JAVA_OPTS
              value: -Xms128m -Xmx320m
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 768Mi
        - name: tls
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: kafka-ui-nginx-conf
        - name: tls
          secret:
            secretName: kafka-ui-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  selector:
    app: kafka-ui
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-ui-tls
  namespace: kafka
spec:
  secretName: kafka-ui-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - kafka.placeholder
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - kafka.placeholder
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: kafka-ui
          port: 443
          weight: 1
