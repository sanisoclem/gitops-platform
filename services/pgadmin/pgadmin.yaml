apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-pgpass
          image: docker.io/dpage/pgadmin4:9.17
          command:
            - sh
            - -c
            - |
              set -eu
              for login in $(tr ',' ' ' < /secret/allowedLogins); do
                dir="/var/lib/pgadmin/storage/$login"
                mkdir -p "$dir"
                cp /secret/pgpass "$dir/.pgpass"
                chmod 600 "$dir/.pgpass"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
      containers:
        - name: pgadmin
          image: docker.io/dpage/pgadmin4:9.17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: placeholder
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin
                  key: password
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            - name: PGADMIN_ENABLE_TLS
              value: "True"
            - name: PGADMIN_LISTEN_PORT
              value: "8443"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: PGPASS_FILE
              value: /pgpass
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: secret
              mountPath: /pgadmin4/config_local.py
              subPath: config_local.py
              readOnly: true
            - name: secret
              mountPath: /pgpass
              subPath: pgpass
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: certs
          secret:
            secretName: pgadmin-tls
            items:
              - key: tls.crt
                path: server.cert
              - key: tls.key
                path: server.key
        - name: servers
          configMap:
            name: pgadmin-servers
        - name: secret
          secret:
            secretName: pgadmin
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  selector:
    app: pgadmin
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgadmin-tls
  namespace: pgadmin
spec:
  secretName: pgadmin-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - pgadmin.placeholder
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - pgadmin.placeholder
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: pgadmin
          port: 443
          weight: 1
