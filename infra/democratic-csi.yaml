apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-block-backed
  namespace: argocd
  labels:
    hempire.money/app-type: cluster-infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-services
  source:
    repoURL: https://democratic-csi.github.io/charts/
    chart: democratic-csi
    targetRevision: 0.15.1
    helm:
      valuesObject:
        csiDriver:
          name: org.democratic-csi.iscsi-backed
        driver:
          existingConfigSecret: democratic-csi-block-backed
          config:
            driver: freenas-api-iscsi
        storageClasses:
          - name: block-backed
            defaultClass: false
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
          - name: block-backed-ephemeral
            defaultClass: false
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
        volumeSnapshotClasses:
          - name: block-backed
            deletionPolicy: Delete
            parameters:
              detachedSnapshots: "false"
        node:
          hostPID: true
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
