apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    hempire.money/app-type: cluster-infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-services
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.21.2
    helm:
      values: |
        crds:
          enabled: true
        global:
          priorityClassName: system-cluster-critical
        prometheus:
          servicemonitor:
            enabled: true
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 15m
              memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 55m
              memory: 80Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
