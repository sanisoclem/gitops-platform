apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    hempire.money/app-type: cluster-infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-services
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.20.4
    helm:
      values: |
        serviceMonitor:
          enabled: true
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 55m
            memory: 240Mi
        certController:
          priorityClassName: system-cluster-critical
          resources:
            requests:
              cpu: 40m
              memory: 208Mi
        webhook:
          priorityClassName: system-cluster-critical
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
