apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  labels:
    hempire.money/app-type: cluster-infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cluster-services
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        controller:
          priorityClassName: system-cluster-critical
          resources:
            requests:
              cpu: 65m
              memory: 224Mi
        speaker:
          priorityClassName: system-node-critical
          frr:
            enabled: false
          resources:
            requests:
              cpu: 190m
              memory: 112Mi
        frr-k8s:
          frrk8s:
            priorityClassName: system-node-critical
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
            frr:
              resources:
                requests:
                  cpu: 110m
                  memory: 64Mi
            reloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
            frrMetrics:
              resources:
                requests:
                  cpu: 10m
                  memory: 80Mi
            frrStatus:
              resources:
                requests:
                  cpu: 20m
                  memory: 80Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
